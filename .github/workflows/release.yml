name: Release-plz

permissions:
  pull-requests: write
  contents: write
  # Required for crates.io Trusted Publishing (OIDC): mints a short-lived token, so no
  # long-lived CARGO_REGISTRY_TOKEN secret is needed. Configure the trusted publisher on
  # crates.io (crate settings → Trusted Publishing) with repo jbr/full-duplex-async-copy and
  # workflow release.yml.
  id-token: write

on:
  push:
    branches:
      - main

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Authenticate with crates.io (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
